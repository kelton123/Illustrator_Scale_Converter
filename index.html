<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #323232;
            color: #E0E0E0;
            padding: 10px;
            font-size: 11px;
        }
        .field {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }
        label { margin-bottom: 4px; color: #AAA; }
        input {
            background: #1E1E1E;
            border: 1px solid #444;
            color: #FFF;
            padding: 5px;
            border-radius: 3px;
        }
        .output {
            background: #252525;
            padding: 8px;
            border-radius: 3px;
            margin: 10px 0;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 8px;
            background: #1473E6;
            border: none;
            color: white;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #0D66D0; }
    </style>
</head>
<body>
    <div class="field">
        <label>Real Length (meters):</label>
        <input type="number" id="meters" value="10" step="0.5">
    </div>
    <div class="field">
        <label>Scale Ratio (1 : X):</label>
        <input type="number" id="scale" value="200" step="1">
    </div>
    <div class="output" id="resultText">Result: 50.00 mm (141.73 pt)</div>
    <button id="drawBtn">Draw Line</button>

    <script src="js/CSInterface.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
